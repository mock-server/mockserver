# Website accordions whose Go tab is allowed to differ from the REST API tab.
# Same format and rules as allowlist.yml (the Ruby tabs): key, the finding
# it accepts (status), a reason, and the digest the check prints. Any other
# finding fails the check, and so does an entry that no longer matches.
#   ruby spec/website_examples/check_website_examples.rb --lang go --verbose

# --- Same as the Ruby tab ---
mock_server/_includes/grpc_mocking.html#button_grpc_record_replay:
  status: differs
  digest: d7e5cdb560d3
  reason: Go replays the expectations it retrieved; the REST API tab saves them to
    a file and uploads that file.
mock_server/_includes/load_scenario_code_examples.html#button_load_lifecycle:
  status: differs
  digest: d453933386c4
  reason: Go also clears the scenario registry at the end; the REST API tab stops
    at stop.
mock_server/_includes/load_scenario_code_examples.html#button_load_rate_soak:
