steps:
  - label: ":dotnet: .NET client unit tests"
    command: ".buildkite/scripts/steps/dotnet-unit-test.sh"
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2

  - label: ":dotnet: .NET website examples match the REST API tab"
    command: ".buildkite/scripts/steps/website-examples.sh csharp"
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2

  # Also in pipeline-ui.yml: a .NET client API change must recompile the
  # dashboard composer's generated C# too, not only a csharp.ts change.
  - label: ":dotnet: composer generated-C# compile gate"
    command: ".buildkite/scripts/steps/ui-client-codegen-compile.sh csharp"
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2

  # Runs the integration suite against a live MockServer built from HEAD.
  # Without this every [SkippableFact] skipped (MOCKSERVER_URL was never set)
  # while the step reported green.
  - label: ":dotnet: :docker: .NET client integration tests"
    command: ".buildkite/scripts/steps/dotnet-integration-test.sh"
    timeout_in_minutes: 20
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2
        # Builds the mockserver jar from HEAD (Maven) before testing. A transient
        # Maven Central resolution failure is remapped to sentinel 42 by
        # run-in-docker.sh; a real test failure exits 1 and can never reach 42.
        - exit_status: 42   # transient Maven Central resolution failure
          limit: 2

  # soft_fail removed: a failing testcontainers suite reported green.
  - label: ":dotnet: :docker: .NET testcontainers tests"
    command: ".buildkite/scripts/steps/dotnet-testcontainers-test.sh"
    timeout_in_minutes: 15
    retry:
      automatic:
        - exit_status: -1   # agent lost (e.g. Spot reclamation)
          limit: 2
        - exit_status: 255  # agent forced shutdown
          limit: 2
