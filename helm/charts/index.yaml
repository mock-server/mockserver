apiVersion: v1
entries:
  mockserver:
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: First-class LLM / AI-agent mocking (Anthropic, OpenAI, Azure OpenAI, Gemini, Bedrock, Ollama) with streaming, conversations and an MCP toolset
        - kind: added
          description: HTTP/3 (QUIC) streaming responses and an optional clustered state backend (mockserver-state-infinispan)
        - kind: added
          description: HTTP chaos / fault injection attachable to mocked or forwarded responses
        - kind: changed
          description: Platform modernised to Java 17 baseline, Netty 4.2 and Jackson 2.22
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Documentation
          url: https://www.mock-server.com
        - name: Chart install guide
          url: https://github.com/mock-server/mockserver-monorepo/blob/master/helm/mockserver/README.md
        - name: Signing public key (cosign)
          url: https://www.mock-server.com/mockserver-cosign.pub
    apiVersion: v1
    appVersion: 9.1.0
    created: "2026-10-21T11:31:34.712866688Z"
    description: Chart to deploy MockServer to Kubernetes.  MockServer is a mocking,
      debugging proxy and chaos engineering tool for multiple protocols (HTTP/1.1,
      HTTP/2, HTTP/3, gRPC, GraphQL, LLM, MCP, Kafka, TCP and more) — mock any system
      you integrate with, record, replay and verify traffic, and inject faults for
      resilience testing.  Its proxy introspects all proxied traffic including encrypted
      TLS and supports Port Forwarding, Web Proxying (i.e. HTTP proxy), HTTPS Tunneling
      Proxying (using HTTP CONNECT) and SOCKS Proxying (i.e. dynamic port forwarding).  Clients
      are available for Java, JavaScript, Python, Ruby, Go, .NET and more.
    digest: d82a9a985b86e14c2cd880d6cbb403028e68a079479c97dba560fb816b479000
